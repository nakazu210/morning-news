name: daily-news

on:
  # GitHubの自動実行は混雑で数時間遅れることがあるので、夜中に何度か起こして早めに作っておき、
  # LINEには 6:30(日本時間)ちょうどに送る。2回目以降は「今日の分はもうある」と分かれば何もしない
  schedule:
    - cron: "13 17,18,19,20 * * *"   # 日本時間 2:13 / 3:13 / 4:13 / 5:13
  workflow_dispatch:         # Actions画面から手動実行もできる(ふだんは「自分だけ」にテスト送信)
    inputs:
      send_to:
        description: "LINEの送り先"
        type: choice
        options: ["自分だけ(テスト)", "全員(社長にも届く)"]
        default: "自分だけ(テスト)"

permissions:
  contents: write   # Releasesにmp3を保存するため
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  KEEP: 7   # 残すエピソード数(古いものは自動削除して容量を節約)
  # 手動実行で「全員」を選ばなかったときはテスト(LINEは LINE_TEST_USER_ID の人だけに送る)
  TEST_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.send_to != '全員(社長にも届く)' }}

jobs:
  # 今日の分がもう作られているか調べる(手動実行のときは毎回作る)
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ep-$(TZ=Asia/Tokyo date +%Y%m%d)"
          # テストで作った分(説明が「テスト」)は、作成済みとみなさず朝にもう一度作って全員に送る
          NOTES=$(gh release view "$TAG" -R "${{ github.repository }}" --json body -q .body 2>/dev/null || echo "none")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NOTES" != "none" ] && [ "$NOTES" != "テスト" ]; then
            echo "今日の分は作成済みなので何もしません"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 作成(最大45分ほど)+ 6:30まで待つ時間
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt

      - name: Get articles sent on previous days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同じ記事をもう一度送らないように、前の日まで(今日の分は除く)3日分の episode.json を取ってくる
          TODAY="ep-$(TZ=Asia/Tokyo date +%Y%m%d)"
          for TAG in $(gh release list --limit 20 --json tagName -q '.[].tagName' | grep '^ep-' | grep -v "^$TODAY$" | sort -r | head -3); do
            gh release download "$TAG" -p episode.json -D "prev/$TAG" || echo "skip $TAG"
          done

      - name: Generate today's episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Save episode to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ env.TEST_SEND == 'true' && 'テスト' || '自動生成エピソード' }}
        run: |
          TAG="ep-$(TZ=Asia/Tokyo date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/episode*.mp3 out/episode.json --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/episode*.mp3 out/episode.json \
              --title "$TAG" --notes "$NOTES"
          fi

      - name: Delete old episodes and collect recent ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^ep-' | sort -r)
          echo "$TAGS" | tail -n +$((KEEP + 1)) | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          for TAG in $(echo "$TAGS" | head -n "$KEEP"); do
            gh release download "$TAG" -D "episodes/$TAG"
          done

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build_feed.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Wait until 6:30 (JST)
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(TZ=Asia/Tokyo date -d "06:30" +%s)
          NOW=$(date +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "6:30まで $(( (TARGET - NOW) / 60 )) 分待ちます"
            sleep $((TARGET - NOW))
          else
            echo "6:30を過ぎているので、すぐに送ります"
          fi

      - name: Send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python notify_line.py
