<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ニュース設定</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #222; --muted: #666; --line: #e3e3e0;
    --accent: #06c755; --accent-text: #fff; --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #222; --text: #eee; --muted: #aaa; --line: #3a3a3a;
      --accent: #06c755; --accent-text: #fff; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    max-width: 560px; margin: auto; padding: 16px; background: var(--bg); color: var(--text);
    line-height: 1.6;
  }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  p.lead { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  section { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  label.cat {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  label.cat:first-of-type { border-top: none; }
  label.cat input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .name { font-weight: 600; }
  .focus { color: var(--muted); font-size: .85rem; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 600; background: var(--accent); color: var(--accent-text); cursor: pointer;
    margin-top: 12px;
  }
  button.sub { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=password] {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  #status { min-height: 1.6em; font-size: .9rem; margin-top: 10px; }
  #status.error { color: var(--error); }
  small { color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<h1>ニュースの種類を選ぶ</h1>
<p class="lead">チェックを入れた種類のニュースが、次の朝から届きます。</p>

<section id="tokenBox" hidden>
  <h2>はじめに:合言葉(トークン)の登録</h2>
  <p><small>変更を保存するために、GitHubで作ったトークンを1度だけ貼り付けてください。この端末のブラウザにだけ保存されます。</small></p>
  <input type="password" id="token" placeholder="github_pat_ から始まる文字列" autocomplete="off">
  <button id="saveToken">登録する</button>
</section>

<section>
  <h2>ニュースの種類</h2>
  <div id="cats"><small>読み込み中…</small></div>
  <button id="save" disabled>保存する</button>
  <button id="runNow" class="sub" disabled>今すぐ配信してみる(約5分後に届きます)</button>
  <div id="status"></div>
</section>

<p><small><a href="./">← 音声の一覧へ</a> ・ <a href="#" id="resetToken">トークンを登録し直す</a></small></p>

<script>
const REPO = "__REPO__";
const API = `https://api.github.com/repos/${REPO}`;
let config = null, sha = null;

const $ = (id) => document.getElementById(id);
const getToken = () => { try { return localStorage.getItem("gh_token") || ""; } catch { return ""; } };
const setToken = (v) => { try { v ? localStorage.setItem("gh_token", v) : localStorage.removeItem("gh_token"); } catch {} };

function status(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}

function headers() {
  const h = { Accept: "application/vnd.github+json" };
  const t = getToken();
  if (t) h.Authorization = `Bearer ${t}`;
  return h;
}

// GitHubは日本語を含むファイルをBase64で受け渡すので、UTF-8として変換する
const decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const encode = (text) => btoa(String.fromCharCode(...new TextEncoder().encode(text)));

async function load() {
  try {
    const res = await fetch(`${API}/contents/config.json?ref=main`, { headers: headers(), cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    sha = data.sha;
    config = JSON.parse(decode(data.content));
    render();
  } catch (e) {
    status(`設定を読み込めませんでした(${e.message})。トークンを確認してください。`, true);
  }
}

function render() {
  $("cats").innerHTML = "";
  config.categories.forEach((c, i) => {
    const label = document.createElement("label");
    label.className = "cat";
    label.innerHTML = `<input type="checkbox" ${c.enabled ? "checked" : ""}>
      <span><span class="name"></span><br><span class="focus"></span></span>`;
    label.querySelector(".name").textContent = c.name;
    label.querySelector(".focus").textContent = c.focus || "";
    label.querySelector("input").addEventListener("change", (ev) => {
      config.categories[i].enabled = ev.target.checked;
      status("まだ保存されていません");
    });
    $("cats").appendChild(label);
  });
  const ready = Boolean(getToken());
  $("save").disabled = !ready;
  $("runNow").disabled = !ready;
  $("tokenBox").hidden = ready;
}

$("save").addEventListener("click", async () => {
  if (!config.categories.some(c => c.enabled)) {
    status("少なくとも1つはチェックを入れてください", true);
    return;
  }
  $("save").disabled = true;
  status("保存しています…");
  try {
    const res = await fetch(`${API}/contents/config.json`, {
      method: "PUT",
      headers: headers(),
      body: JSON.stringify({
        message: "管理画面からニュースの種類を変更",
        content: encode(JSON.stringify(config, null, 2) + "\n"),
        sha,
        branch: "main",
      }),
    });
    if (!res.ok) throw new Error(res.status);
    sha = (await res.json()).content.sha;
    status("保存しました。次の朝の配信から反映されます。");
  } catch (e) {
    status(`保存できませんでした(${e.message})。トークンの権限を確認してください。`, true);
  } finally {
    $("save").disabled = false;
  }
});

$("runNow").addEventListener("click", async () => {
  $("runNow").disabled = true;
  status("配信を開始しています…");
  try {
    const res = await fetch(`${API}/actions/workflows/daily.yml/dispatches`, {
      method: "POST", headers: headers(), body: JSON.stringify({ ref: "main" }),
    });
    if (!res.ok) throw new Error(res.status);
    status("配信を開始しました。5分ほどでLINEに届きます。");
  } catch (e) {
    status(`開始できませんでした(${e.message})。トークンの権限を確認してください。`, true);
  } finally {
    $("runNow").disabled = false;
  }
});

$("saveToken").addEventListener("click", () => {
  const v = $("token").value.trim();
  if (!v) return;
  setToken(v);
  $("token").value = "";
  status("トークンを登録しました");
  load();
});

$("resetToken").addEventListener("click", (ev) => {
  ev.preventDefault();
  setToken("");
  render();
  status("トークンを削除しました。もう一度登録してください。");
});

load().then(() => { if (!config) $("tokenBox").hidden = Boolean(getToken()); });
</script>
</body>
</html>
